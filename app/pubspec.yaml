name: qwe1
description: Your self-hosted servers, in your pocket. No cloud. Ever.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.2.0

  # Navigation
  go_router: ^13.0.0

  # Networking
  dio: ^5.3.0
  web_socket_channel: ^2.3.0

  # Local storage
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.8.0

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Serialization
  json_annotation: ^4.8.0
  freezed_annotation: ^2.4.0

  # UI
  fl_chart: ^0.66.0
  shimmer: ^3.0.0

  # Platform
  local_auth: ^2.1.0
  flutter_local_notifications: ^16.0.0
  permission_handler: ^10.4.0
  share_plus: ^7.0.0
  url_launcher: ^6.1.0

  # Utils
  intl: ^0.18.0
  uuid: ^4.1.0
  collection: ^1.17.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation
  build_runner: ^2.4.0
  drift_dev: ^2.14.0
  json_serializable: ^6.7.0
  freezed: ^2.4.0

  # Testing
  mocktail: ^1.0.0
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/icons/
