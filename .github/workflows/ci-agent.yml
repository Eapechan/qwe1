name: Agent CI

on:
  pull_request:
    paths: ["agent/**", ".github/workflows/ci-agent.yml"]
  push:
    branches: [main]
    paths: ["agent/**", ".github/workflows/ci-agent.yml"]

concurrency:
  group: ci-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
        working-directory: agent
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest && staticcheck ./...
        working-directory: agent

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test ./... -race -coverprofile=coverage.out
        working-directory: agent
      - uses: codecov/codecov-action@v4
        with:
          files: agent/coverage.out

  build-matrix:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: arm
            goarm: "7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} go build ./cmd/qwe1-agent
        working-directory: agent
