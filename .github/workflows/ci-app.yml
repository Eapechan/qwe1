name: App CI

on:
  pull_request:
    paths: ["app/**", "api/**", ".github/workflows/ci-app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "api/**", ".github/workflows/ci-app.yml"]

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app

  test:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter test --coverage
        working-directory: app
      - uses: codecov/codecov-action@v4
        with:
          files: app/coverage/lcov.info

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --debug
        working-directory: app
